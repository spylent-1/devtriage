name: devtriage-knowledge
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devtriage
      POSTGRES_USER: devtriage
      POSTGRES_PASSWORD: ${DEVTRIAGE_KB_PASSWORD:?Set DEVTRIAGE_KB_PASSWORD}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["knowledge-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U devtriage -d devtriage"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  knowledge-data:
